plugins {
    id "com.github.johnrengelman.shadow" version "8.1.1"
    id "com.matthewprenger.cursegradle" version "1.4.0"
    id "com.modrinth.minotaur" version "2.+"
}

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common
    shadowCommon // Don't use shadow from the shadow plugin because we don't want IDEA to index this.
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    modApi "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_version}"
    modApi "dev.architectury:architectury-fabric:${rootProject.architectury_version}"

    common(project(path: ":common", configuration: "namedElements")) { transitive false }
    shadowCommon(project(path: ":common", configuration: "transformProductionFabric")) { transitive false }
    shadowCommon "dev.arbjerg:lavaplayer:2.2.7"
    shadowCommon "dev.lavalink.youtube:v2:1.18.1"
    shadowCommon "dev.lavalink.youtube:common:1.18.1"
    shadowCommon "com.grack:nanojson:1.7"
    shadowCommon "org.mozilla:rhino-engine:1.7.15"
    shadowCommon "org.mozilla:rhino:1.7.15"
    implementation "dev.arbjerg:lavaplayer:2.2.7"
    implementation "dev.lavalink.youtube:v2:1.18.1"
    implementation "dev.lavalink.youtube:common:1.18.1"

    // SimpleVoiceChat dependencies
    modRuntimeOnly "maven.modrinth:simple-voice-chat:fabric-${voicechat_version}"
    //modRuntimeOnly("maven.modrinth:modmenu:8.0.1")
}

shadowJar {
    exclude "org/slf4j/**"

    configurations = [project.configurations.shadowCommon]
    relocate "com.sedmelluq.discord.lavaplayer", "fr.flaton.walkietalkie.shadow.lavaplayer"
    relocate "dev.lavalink.youtube", "fr.flaton.walkietalkie.shadow.youtube"
    relocate "com.fasterxml.jackson", "fr.flaton.walkietalkie.shadow.jackson"
    relocate "com.grack.nanojson", "fr.flaton.walkietalkie.shadow.nanojson"
    relocate "commons-io", "fr.flaton.walkietalkie.shadow.commonsio"
    relocate "org.apache.commons.io", "fr.flaton.walkietalkie.shadow.commonsio"
    relocate "org.apache.commons.logging", "fr.flaton.walkietalkie.shadow.commonslogging"
    relocate "org.apache.commons.codec", "fr.flaton.walkietalkie.shadow.commonscodec"
    relocate "org.apache.http", "fr.flaton.walkietalkie.shadow.apache.http"
    relocate "org.jsoup", "fr.flaton.walkietalkie.shadow.jsoup"
    relocate "org.json", "fr.flaton.walkietalkie.shadow.orgjson"
    relocate "org.mozilla", "fr.flaton.walkietalkie.shadow.mozilla"
    relocate "net.iharder", "fr.flaton.walkietalkie.shadow.base64"
    archiveClassifier.set("dev-shadow")
}

def getGitCommitHash() {
    try {
        def stdout = new ByteArrayOutputStream()
        exec {
            commandLine 'git', 'rev-parse', '--short', 'HEAD'
            standardOutput = stdout
        }
        return stdout.toString().trim()
    } catch (ignored) {
        return 'unknown'
    }
}

remapJar {
    inputFile.set shadowJar.archiveFile
    dependsOn shadowJar

    if (minecraft_version == min_minecraft_version) {
        archiveAppendix.set("fabric-${minecraft_version}-${getGitCommitHash()}")
    } else {
        archiveAppendix.set("fabric-${min_minecraft_version}-${minecraft_version}-${getGitCommitHash()}")
    }

    archiveClassifier.set(null)
}

jar {
    archiveClassifier.set("dev")
}

sourcesJar {
    def commonSources = project(":common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}
